# GitHub Pages serves the site from the gh-pages branch.
# Every push to main copies main to gh-pages, so edit and push main only.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main to gh-pages
        run: git push --force origin HEAD:gh-pages
